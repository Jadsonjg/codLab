<head>

    <title>Sistema de Cadastro</title>

<body>
    <div class="title">
        <h1>Cadastro de Usuários</h1>
    </div>
    <div class="corpo">
        <form>
            
            
        <div class="form">
                <label class="etiqueta" for="nome">Nome</label>
                <input class="campo" id="nome" type="text">
                <span id="nome-span"></span>
                <label class="etiqueta" for="email">E-mail</label>
                <input class="campo" id="email" type="email" placeholder="email@email.com">
                <span id="nome-span"></span>
                <button class="conffirm-button" type="button" id="cadastrar">CADASTRAR</button>
                
        </form>
        </div>
        <div class="list">
            <h2>Lista de Usuários</h2>
            <div class="cadastros">
                <div>
                    <ul id="list">
                        <li>Jadson</li>
                    </ul>
                </div>
                <div>
                    <button class="trash"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        </div>
        
    </div>
<script src="script.js"></script>
