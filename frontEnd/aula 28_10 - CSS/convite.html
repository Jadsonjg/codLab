5. Ter a linha do meio fininha e da mesma cor do texto

* Crie os arquivos meu-convite.html e estilos/meu-convite.css

* A fonte do nome não pode ser a mesma da aula
* Escolha as suas próprias cores, mas tem que dar para ler o texto
* Não vale copiar o CSS da aula, o estilo tem que ser seu

Desafio extra (opcional): ⭐
Coloque um brilho ou glitter de fundo no convite, como nos convites que a gente recebe no celular. -->
