<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>Inscrição no campeonato de FIFA</title>
</head>
<body>
  <h1>Inscrição no campeonato de FIFA</h1>

  <form id="inscricaoForm">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" />

    <label for="idade">Idade:</label>
    <input type="number" id="idade" />

    <label for="email">E-mail:</label>
    <input type="email" id="email" />
    <small id="dica"></small>

    <button type="button" id="confirmarBtn">Confirmar inscrição</button>
  </form>

  <p id="saida">Preencha os dados e confirme.</p>

  <script src="script.js"></script>
</body>
</html>
